# Local development overrides — activate with SPRING_PROFILES_ACTIVE=local
# or add -Dspring.profiles.active=local in your run configuration.
# Never commit secrets; this file is safe to commit because it has no real credentials.

spring:
  cloud:
    aws:
      appconfig:
        enabled: false   # never hits AWS in local dev

  datasource:
    password: ${DB_APP_PASSWORD:walletwizzard_app_dev}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Point at your local auth server, or use a test JWKS URI.
          # For quick local testing without a real auth server, override
          # SecurityConfig to permit all in the local profile.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false

logging:
  level:
    com.moksh.walletwizzard: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG

app:
  oauth:
    client-id: local-dev-client
    cognito-domain: localhost
    base-url: http://localhost:8080
